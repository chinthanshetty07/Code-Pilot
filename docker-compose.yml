services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: codepilot
      POSTGRES_DB: codepilot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://codepilot:codepilot@postgres:5432/codepilot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8010:8000"
    volumes:
      - ./apps/api:/app
      - /app/.venv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://codepilot:codepilot@postgres:5432/codepilot
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
      - /app/.venv
      # Sibling-container access for the Milestone 7 sandboxed test runner:
      # the worker spins up ephemeral, resource-limited containers to run a
      # generated diff's tests, rather than executing them in-process. Only
      # `worker` gets this, not `api` -- the API container has no need to
      # talk to Docker and shouldn't have the ability to. This grants the
      # worker broad control over the Docker host (the standard, accepted
      # tradeoff of the docker-socket-mounting pattern) -- reasonable for a
      # local dev environment; revisit before ever deploying this shared.
      - /var/run/docker.sock:/var/run/docker.sock
    command: arq app.workers.worker.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8010
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages/shared-types:/repo/packages/shared-types
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
      - /repo/node_modules
    command: pnpm dev
    depends_on:
      - api

volumes:
  postgres_data:
